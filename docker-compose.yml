# SQL Server para el Sistema de Tickets de Soporte (SC-701).
# Uso:  docker compose up -d        → levanta la base (la contraseña se lee de .env)
#       ./database/inicializar.sh   → crea el esquema, SP y datos de prueba
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64            # en Mac con Apple Silicon corre con Rosetta
    container_name: sc701-soporte-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:?Defina SQLSERVER_SA_PASSWORD en el archivo .env}
      MSSQL_PID: Developer
    ports:
      - "${SQLSERVER_PUERTO:-14330}:1433"   # 14330 para no chocar con otro SQL Server en 1433
    volumes:
      - sc701-soporte-datos:/var/opt/mssql  # los datos sobreviven a "docker compose down"
      - ./database:/scripts:ro              # scripts SQL disponibles dentro del contenedor
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  sc701-soporte-datos:
